; SIMPEL application pool. Other applications keep the www pool.
[simpel]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-simpel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 16M
